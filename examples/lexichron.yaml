# lexichron settings file: one corpus, one section per stage.
#
# Run a stage with:   lexichron acquire lexichron.yaml      lexichron filter lexichron.yaml
# Override a value:   lexichron acquire lexichron.yaml --set acquire.workers=20
# See the call only:  lexichron filter lexichron.yaml --dry-run
#
# `corpus` is shared by every stage. Each other section holds the settings of
# one stage, named exactly as in that stage's Python function.

corpus:
  release: "20200217"          # Google Books Ngrams release (YYYYMMDD)
  language: eng-us             # corpus id: eng, eng-us, eng-gb, fre, ger, ita, rus, spa, heb, chi-sim
  ngram_size: 1                # 1-5
  db_path_stub: /scratch/USERNAME/NLP_corpora/Google_Books/
  # archive_path_stub: /scratch/USERNAME/NLP_corpora/archives/   # optional .tar.zst archive after ingest

acquire:
  ngram_type: tagged           # all | tagged | untagged
  workers: 45
  overwrite_db: false
  random_seed: 321
  open_type: write:packed24
  compact_after_ingest: false
  # chunk_entries: 200000     # entries per spooled chunk; lower on small allocations
  # spool_dir: /tmp            # where chunks are spooled (node-local disk is ideal)
  # file_range: [0, 10]        # process only files 0-9 (for a quick test)
  # combined_bigrams: [human being, human beings]   # hyphenated into single tokens

filter:
  # text_language: en          # default: derived from the corpus (eng-us -> en)
  lowercase: true
  lemmatize: true
  drop_stopwords: true
  alpha_only: true
  # ascii_only: true           # default: on for English, off otherwise
  min_len: 3
  # min_context_tokens: 2      # default: 1 for unigrams, 2 for longer n-grams
  bin_size: 1                  # 5 = five-year bins
  # vocabulary: ...            # default for 2-5-grams: this corpus's 1grams_processed.db/whitelist.txt
  # always_include: [he, she, his, her]
  # pivot: true               # year-keyed database for training; default: 2-5-grams only
  # output_vocabulary: true    # write <database>/whitelist.txt; default: unigrams only
  output_vocabulary_top_n: 30000
  output_vocabulary_year_range: [1968, 2019]
  output_vocabulary_spell_check: true
  workers: 20
  mode: resume                 # resume | restart
  compact_after_ingest: true
