[project]
name = "lexichron"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.5",
    "seaborn>=0.11",
    "scikit-learn>=1.0",
    "statsmodels>=0.13",
    "gensim>=4.0",
    "spacy[lookups]>=3.0",
    "tqdm>=4.64",
    "setproctitle>=1.3",
    "lz4>=4.0",
    "simplemma>=0.9",
    "pyenchant>=3.2",
    "nltk>=3.7",
    "beautifulsoup4>=4.9",
    "openpyxl>=3.0",
    "ipykernel>=6.0",
    "jupyter_client>=7.0",
    "nbformat>=5.0",
    "pyyaml>=6.0",
    "rocks-shim @ https://github.com/eric-d-knowles/rocks-shim/releases/download/0.3.0/rocks_shim-0.3.0-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl ; platform_system == 'Linux'",
]

[project.optional-dependencies]
ui = ["textual>=0.80"]

[project.scripts]
lexichron = "lexichron.cli:main"

[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "Cython>=0.29.36",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
