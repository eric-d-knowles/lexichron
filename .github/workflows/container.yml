name: Build container image

# Builds the Apptainer image from container/lexichron.def and publishes it to
# the GitHub Container Registry (ghcr.io) as an ORAS artifact.
#
#   - On a version tag (v0.2.0): publish ghcr.io/<owner>/lexichron:0.2.0 and
#     move the "latest" tag to it. The tag must match the version declared in
#     pyproject.toml, otherwise the build fails early.
#   - Manual run (Actions tab -> "Run workflow"): publish the current commit as
#     ghcr.io/<owner>/lexichron:<tag> (default "dev") for testing, without
#     touching "latest". Use a distinct tag to keep several test images.
#
# Users pull with:
#   apptainer pull lexichron-0.2.0.sif oras://ghcr.io/eric-d-knowles/lexichron:0.2.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish for this manual build (never 'latest')"
        default: "dev"
        required: false

env:
  BASE_IMAGE: python:3.11-slim-bookworm

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        # The hosted runner has ~14 GB free; the build plus the .sif need room.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Determine image tag
        id: meta
        run: |
          set -eu
          PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "::error::Git tag v${TAG_VERSION} does not match pyproject.toml version ${PKG_VERSION}"
              exit 1
            fi
            echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
            echo "publish_latest=true" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.event.inputs.tag }}"
            TAG="${TAG:-dev}"
            if [[ "${TAG}" == "latest" || "${TAG}" =~ ^[0-9] ]]; then
              echo "::error::manual builds may not publish 'latest' or a version-like tag; use a git tag for releases"
              exit 1
            fi
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "publish_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lexichron" >> "$GITHUB_OUTPUT"

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      # Registries rate-limit anonymous pulls from the shared runner addresses
      # (public ECR: "Data limit exceeded"; Docker Hub: 100 pulls per 6 h), so
      # the base image is pulled once, with fallbacks, and kept in the
      # Actions cache; the build then bootstraps from the local copy.
      - name: Restore the base image
        id: base-cache
        uses: actions/cache@v4
        with:
          path: base
          key: base-image-python-3.11-slim-bookworm-v1

      - name: Fetch the base image
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: |
          set -u
          mkdir -p base
          for src in "docker://public.ecr.aws/docker/library/${BASE_IMAGE}" \
                     "docker://docker.io/library/${BASE_IMAGE}"; do
            for attempt in 1 2 3; do
              if apptainer pull --force base/python.sif "$src"; then
                echo "pulled $src"; exit 0
              fi
              echo "attempt $attempt at $src failed; waiting"; sleep $((attempt * 30))
            done
          done
          echo "::error::could not pull the base image ${BASE_IMAGE} from any registry"
          exit 1

      - name: Build image
        run: |
          set -eu
          # --notest: the %test section runs as its own step below so that a
          # failure there is reported with annotations.
          # Manual builds are stamped with their tag and commit (see
          # lexichron/__init__.py); release builds report the plain version.
          if [[ "${{ steps.meta.outputs.publish_latest }}" != "true" ]]; then
            echo "BUILD = \"${{ steps.meta.outputs.version }}.${GITHUB_SHA::7}\"" > src/lexichron/_build.py
          fi
          apptainer build --fakeroot --notest --build-arg BOOTSTRAP=localimage --build-arg BASE=base/python.sif \
            lexichron.sif container/lexichron.def 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0 || {
            # the tail of the log as one annotation (readable through the API when the log itself is not)
            tail -n 80 build.log | grep -vE "perl|^(Get|Selecting|Preparing|Unpacking|Setting up):?" \
              | python3 -c 'import sys; t = sys.stdin.read(); print("::error title=apptainer build failed::" + t[-3800:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1; }
          ls -lh lexichron.sif

      - name: Run image self-test
        run: |
          set -o pipefail
          if ! apptainer test lexichron.sif 2>&1 | tee test.log; then
            # Surface the failing test names and assertion lines as annotations
            grep -E "^(FAILED|ERROR) |Error:|AssertionError|assert " test.log | head -30 | sed 's/^/::error::/'
            exit 1
          fi
          apptainer exec lexichron.sif python -c "import enchant; print(sorted(enchant.list_languages()))"

      - name: Run unit tests inside the image
        run: |
          set +e
          apptainer exec lexichron.sif python -m pytest -q -rfs /opt/lexichron/tests > pytest.out 2>&1
          rc=$?
          cat pytest.out
          grep -E '^(FAILED|ERROR) ' pytest.out | cut -c1-400 | sed 's/^/::error::/'
          echo "::notice::pytest: $(tail -1 pytest.out)"
          exit $rc

      - name: Report image contents
        # Written to the run summary so the build is self-describing without
        # access to the registry.
        run: |
          {
            echo "## Image report"
            echo
            echo "- size: $(du -h lexichron.sif | cut -f1)"
            echo "- apps: $(apptainer inspect --list-apps lexichron.sif | tr '\n' ' ')"
            echo "- lexichron: $(apptainer exec lexichron.sif python -c 'import ngramprep; print(ngramprep.__version__)')"
            echo "- python: $(apptainer exec lexichron.sif python -c 'import sys; print(sys.version.split()[0])')"
            echo "- /opt/lexichron: $(apptainer exec lexichron.sif ls /opt/lexichron | tr '\n' ' ')"
            echo
            echo '```'
            apptainer inspect --list-apps lexichron.sif
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The app must exist, or the build is wrong.
          apptainer inspect --list-apps lexichron.sif | grep -qx register-kernel
          apptainer inspect --list-apps lexichron.sif | grep -qx new-project

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            --username "${{ github.actor }}" --password-stdin oras://ghcr.io

      - name: Push image
        run: |
          set -eu
          IMAGE="${{ steps.meta.outputs.image }}"
          VERSION="${{ steps.meta.outputs.version }}"
          apptainer push lexichron.sif "oras://${IMAGE}:${VERSION}"
          if [[ "${{ steps.meta.outputs.publish_latest }}" == "true" ]]; then
            apptainer push lexichron.sif "oras://${IMAGE}:latest"
          fi
          {
            echo "## Published"
            echo
            echo "- oras://${IMAGE}:${VERSION}"
            [[ "${{ steps.meta.outputs.publish_latest }}" == "true" ]] && echo "- oras://${IMAGE}:latest"
            echo "- sha256: $(sha256sum lexichron.sif | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image as workflow artifact
        # Also keep the .sif attached to the run for 7 days, for anyone who
        # cannot pull from ghcr.io.
        uses: actions/upload-artifact@v4
        with:
          name: lexichron-${{ steps.meta.outputs.version }}.sif
          path: lexichron.sif
          retention-days: 7
